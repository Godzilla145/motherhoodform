<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="nlparto-emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="nlparto-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="nlparto-heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="nlparto-text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- Soft Drop Shadow -->
    <filter id="nlparto-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f766e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ================= EMBLEM ================= -->
  <g transform="translate(6, 6)" filter="url(#nlparto-shadow)">
    <!-- Base Rounded Shield / Pebble -->
    <rect x="0" y="0" width="68" height="68" rx="20" fill="url(#nlparto-emblem-grad)" />
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="1" y="1" width="66" height="66" rx="19" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Pulse Line / ECG Accent at Bottom of Emblem -->
    <path d="M 12 48 L 22 48 L 27 40 L 33 54 L 38 44 L 42 48 L 56 48" 
          stroke="#5eead4" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Stylized Mother Silhouette (Gentle Arc & Head) -->
    <!-- Mother Head -->
    <circle cx="30" cy="22" r="5.5" fill="#ffffff" />
    <!-- Mother Body Arc (Curving down protectively) -->
    <path d="M 23 37 C 22 28, 38 28, 37 37 C 37 42, 33 44, 27 44 C 23 44, 21 41, 23 37 Z" fill="#ffffff" fill-opacity="0.95" />

    <!-- Baby Silhouette (Nestled inside Mother's embrace) -->
    <!-- Baby Head -->
    <circle cx="39" cy="29" r="3.8" fill="#a7f3d0" />
    <!-- Baby Swaddle Wrap -->
    <path d="M 36 34 C 42 33, 44 38, 41 42 C 38 45, 34 43, 33 39 Z" fill="#a7f3d0" fill-opacity="0.9" />

    <!-- Tender Heart / Care Spark Accent -->
    <path d="M 46 16 C 46 14, 48 13, 50 14 C 52 13, 54 14, 54 16 C 54 18, 50 21, 50 21 C 50 21, 46 18, 46 16 Z" fill="url(#nlparto-heart-grad)" />
    
    <!-- Digital AI Node Dots -->
    <circle cx="16" cy="18" r="1.8" fill="#5eead4" fill-opacity="0.8" />
    <circle cx="14" cy="26" r="1.2" fill="#5eead4" fill-opacity="0.6" />
    <path d="M 16 18 L 14 26" stroke="#5eead4" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- Main Brand Name: NLParto -->
  <g transform="translate(88, 12)">
    <!-- "NLP" (Strong Navy/Charcoal, Technical Precision) -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">
      NLP
    </text>

    <!-- "arto" (Teal/Emerald Medical Gradient, Warmth & Humanity) -->
    <text x="61" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#nlparto-text-grad)" letter-spacing="-0.02em">
      arto
    </text>

    <!-- AI Sparkle Icon ✦ -->
    <path d="M 125 14 Q 125 20, 131 20 Q 125 20, 125 26 Q 125 20, 119 20 Q 125 20, 125 14 Z" fill="url(#nlparto-spark-grad)" />

    <!-- Subtitle / Tagline Pill -->
    <rect x="0" y="40" width="186" height="18" rx="5" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1" />
    <text x="8" y="52.5" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#0f766e" letter-spacing="0.06em">
      SANTÉ MATERNELLE &amp; IA CLINIQUÉ
    </text>

    <!-- Country / Scope Micro Badge -->
    <text x="136" y="52.5" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="800" fill="#059669" letter-spacing="0.04em">
      • ALGÉRIE
    </text>
  </g>
</svg>
